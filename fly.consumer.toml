# fly.toml app configuration file generated for fincapy-consumer on 2025-02-18T08:33:06-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fincapy-consumer'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile.consumer'

[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  ports = []

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
